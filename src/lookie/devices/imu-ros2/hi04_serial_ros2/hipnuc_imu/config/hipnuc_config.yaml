IMU_publisher:
    ros__parameters:
        serial_port: "/dev/ttyUSB0"
        baud_rate: 460800
        frame_id: "imu_head_link"
        imu_switch: TRUE
        imu_topic: "/imu_head_data"
        euler_switch: TRUE
        euler_topic: "/imu_head_euler_data"
        magnetic_switch: FALSE
        magnetic_topic: "/imu_head_magnetic_data"
        temperature_switch: FALSE
        temperature_topic: "/imu_head_temp_data"
        pressure_switch: FALSE
        pressure_topic: "/imu_head_pressure_data"
        publish_tf: false
        tf_parent_frame: "world"
        tf_child_frame_id: ""  # Empty uses frame_id
        wait_for_device_timeout: -1.0
        reconnect_timeout: 6.0
        reconnect_attempts: -1
        data_timeout: 2.0
        # Right-hand attitude calibration in degrees; local Rz(yaw) Ry(pitch) Rx(roll).
        imu_install_roll_deg: 0.0
        imu_install_pitch_deg: 0.0
        imu_install_yaw_deg: 0.0
        installation: ""  # Empty: do not configure device. Legacy: "1,0,0,0,1,0,0,0,1"; newer: "24"
        command_timeout_ms: 2000
        calibration_save: false  # Explicit opt-in to save level calibration to device Flash
        command_verification: true  # False: writes only; device execution is unverified
        session_valid_topic: "/imu_head_session_valid"  # std_msgs/Bool; valid data received in this connection
        yaw_reset_applied_topic: "/imu_head_yaw_reset_applied"  # std_msgs/Bool; acknowledged yaw reset in this session
